name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow through OIDC (trusted publishing)

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      # --provenance links the published package to this workflow run.
      - run: npm publish --provenance --access public
